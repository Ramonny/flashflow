<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashFlow</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="title">FlashFlow</h1>
      <span class="progress" id="progress">Card 1 de 5</span>

      <div class="card" id="card">
        <p class="card-text" id="cardText"></p>
      </div>

      <span class="hint">Clique no card para ver a resposta</span>

      <button class="next-button" id="nextButton">Próximo Card</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
